<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>ZeZo Login — Beta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#050505;
  --panel:#090909;
  --white:#f5f5f5;
  --gray:#888;
  --line:rgba(255,255,255,.18);
  --red:#ff6565;
  --ease:cubic-bezier(.16,1,.3,1);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  display:grid;
  min-height:100vh;
  place-items:center;
  overflow:hidden;
  background:var(--black);
  color:var(--white);
  font-family:"Space Grotesk",Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  opacity:.07;
  background-image:
    linear-gradient(rgba(255,255,255,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px);
  background-size:70px 70px;
}

body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  opacity:.035;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    #fff 4px
  );
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.background-orbit{
  position:fixed;
  top:50%;
  left:50%;
  width:min(70vw,720px);
  aspect-ratio:1;
  border:1px solid rgba(255,255,255,.1);
  border-radius:50%;
  box-shadow:
    0 0 0 45px rgba(255,255,255,.025),
    0 0 0 95px rgba(255,255,255,.015);
  transform:translate(-50%,-50%);
  animation:rotate 28s linear infinite;
}

.background-orbit:before,
.background-orbit:after{
  content:"";
  position:absolute;
  inset:15%;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  transform:rotate(55deg) scaleX(.42);
}

.background-orbit:after{
  transform:rotate(-55deg) scaleX(.42);
}

.orbit-light{
  position:absolute;
  top:10%;
  left:46%;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 28px 9px rgba(255,255,255,.6);
}

@keyframes rotate{
  to{
    rotate:360deg;
  }
}

.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:25px clamp(22px,5vw,75px);
  color:#aaa;
  font-size:9px;
  letter-spacing:.2em;
  text-transform:uppercase;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  color:#fff;
  font-weight:700;
}

.brand-mark{
  display:grid;
  place-items:center;
  width:25px;
  height:25px;
  border:1px solid #fff;
  border-radius:50%;
  font-size:9px;
}

.login-wrapper{
  position:relative;
  z-index:2;
  width:min(450px,calc(100% - 35px));
  padding:44px 32px 32px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.55);
  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(255,255,255,.15),
      transparent 42%
    ),
    linear-gradient(
      135deg,
      rgba(255,255,255,.08),
      transparent 38%
    ),
    var(--panel);
  box-shadow:
    0 25px 100px rgba(0,0,0,.9),
    0 0 70px rgba(255,255,255,.08);
  animation:appear .8s var(--ease) forwards;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(30px) scale(.94);
    filter:blur(5px);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
  }
}

.login-wrapper:before{
  content:"ZEZO SECURE ACCESS // BETA";
  position:absolute;
  top:16px;
  left:20px;
  color:#666;
  font-size:8px;
  letter-spacing:.16em;
}

.login-wrapper:after{
  content:"AUTH-001";
  position:absolute;
  right:20px;
  bottom:17px;
  color:#444;
  font-size:8px;
  letter-spacing:.16em;
}

.login-glow{
  position:absolute;
  top:-125px;
  left:50%;
  width:270px;
  height:270px;
  border-radius:50%;
  background:rgba(255,255,255,.1);
  filter:blur(75px);
  pointer-events:none;
  transform:translateX(-50%);
}

.login-header{
  position:relative;
  z-index:1;
  margin-bottom:29px;
  text-align:center;
}

.login-symbol{
  display:grid;
  place-items:center;
  width:62px;
  height:62px;
  margin:0 auto 20px;
  border:1px solid #fff;
  border-radius:50%;
  color:#fff;
  font-size:24px;
  box-shadow:0 0 25px rgba(255,255,255,.35);
  animation:pulse 2.2s infinite;
}

@keyframes pulse{
  0%,100%{
    box-shadow:0 0 18px rgba(255,255,255,.3);
  }

  50%{
    box-shadow:0 0 42px rgba(255,255,255,.65);
  }
}

.login-title{
  font-size:28px;
  font-weight:600;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.login-subtitle{
  margin-top:9px;
  color:#777;
  font-size:10px;
  letter-spacing:.15em;
  text-transform:uppercase;
}

.form-field{
  position:relative;
  z-index:1;
  margin-bottom:19px;
}

.form-field label{
  display:block;
  margin-bottom:8px;
  color:#888;
  font-size:9px;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.form-field input{
  width:100%;
  padding:16px 15px;
  outline:none;
  border:1px solid var(--line);
  background:rgba(0,0,0,.55);
  color:#fff;
  font-size:12px;
  transition:.35s var(--ease);
}

.form-field input::placeholder{
  color:#4e4e4e;
}

.form-field input:focus{
  border-color:#fff;
  background:rgba(255,255,255,.06);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.16),
    0 0 25px rgba(255,255,255,.08);
}

.password-box{
  position:relative;
}

.password-box input{
  padding-right:50px;
}

.password-toggle{
  position:absolute;
  top:50%;
  right:13px;
  border:0;
  background:transparent;
  color:#777;
  font-size:13px;
  transform:translateY(-50%);
}

.password-toggle:hover{
  color:#fff;
}

.submit-button{
  position:relative;
  z-index:1;
  width:100%;
  padding:17px;
  overflow:hidden;
  border:1px solid #fff;
  background:#fff;
  color:#000;
  font-size:10px;
  font-weight:700;
  letter-spacing:.25em;
  text-transform:uppercase;
  transition:.4s var(--ease);
}

.submit-button:before{
  content:"";
  position:absolute;
  inset:0;
  background:#000;
  transform:translateX(-101%);
  transition:.5s var(--ease);
}

.submit-button span{
  position:relative;
  z-index:1;
}

.submit-button:hover{
  color:#fff;
  box-shadow:0 0 35px rgba(255,255,255,.25);
}

.submit-button:hover:before{
  transform:translateX(0);
}

.submit-button.loading{
  pointer-events:none;
  color:#999;
}

.submit-button.loading:after{
  content:"";
  position:absolute;
  top:50%;
  right:18px;
  width:13px;
  height:13px;
  border:1px solid #777;
  border-top-color:#000;
  border-radius:50%;
  animation:spin .7s linear infinite;
  transform:translateY(-50%);
}

@keyframes spin{
  to{
    transform:translateY(-50%) rotate(360deg);
  }
}

.status-text{
  position:relative;
  z-index:1;
  min-height:18px;
  margin-top:16px;
  color:#666;
  font-size:10px;
  line-height:1.5;
  text-align:center;
}

.notification{
  position:fixed;
  top:25px;
  left:50%;
  z-index:100;
  display:flex;
  align-items:center;
  gap:13px;
  width:min(430px,calc(100% - 35px));
  padding:16px 18px;
  border:1px solid rgba(255,255,255,.4);
  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.03)
    ),
    rgba(5,5,5,.9);
  box-shadow:
    0 18px 70px rgba(0,0,0,.8),
    0 0 35px rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-30px) scale(.94);
  transition:.65s var(--ease);
}

.notification.show{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,0) scale(1);
}

.notification.error{
  border-color:rgba(255,80,80,.75);
}

.notification-icon{
  display:grid;
  flex:0 0 auto;
  place-items:center;
  width:31px;
  height:31px;
  border:1px solid #fff;
  border-radius:50%;
  color:#fff;
  font-size:14px;
}

.notification.error .notification-icon{
  border-color:#ff6565;
  color:#ff6565;
}

.notification-body{
  min-width:0;
}

.notification-label{
  margin-bottom:5px;
  color:#777;
  font-size:8px;
  letter-spacing:.18em;
  text-transform:uppercase;
}

.notification-message{
  color:#fff;
  font-size:12px;
  line-height:1.4;
}

.notification-close{
  margin-left:auto;
  border:0;
  background:transparent;
  color:#777;
  font-size:17px;
}

.notification-close:hover{
  color:#fff;
}

.footer{
  position:fixed;
  right:0;
  bottom:24px;
  left:0;
  color:#4f4f4f;
  font-size:8px;
  letter-spacing:.2em;
  text-align:center;
  text-transform:uppercase;
}

@media(max-width:600px){
  body{
    overflow:auto;
  }

  .background-orbit{
    width:125vw;
  }

  .topbar{
    padding:20px;
  }

  .login-wrapper{
    padding:44px 24px 32px;
  }

  .login-title{
    font-size:24px;
  }

  .footer{
    position:relative;
    margin:30px 0 20px;
  }
}
</style>
</head>

<body>

<div class="background-orbit">
  <div class="orbit-light"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Z</span>
    <span>ZeZo</span>
  </div>

  <span>Beta Login</span>
</header>

<main class="login-wrapper">
  <div class="login-glow"></div>

  <div class="login-header">
    <div class="login-symbol">Z</div>

    <h1 class="login-title">
      ZeZo Login
    </h1>

    <p class="login-subtitle">
      Secure beta access
    </p>
  </div>

  <form id="loginForm">

    <div class="form-field">
      <label for="username">
        Username
      </label>

      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        placeholder="Masukan Username"
        required
      >
    </div>

    <div class="form-field">
      <label for="password">
        Password
      </label>

      <div class="password-box">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukan Password"
          required
        >

        <button
          class="password-toggle"
          id="passwordToggle"
          type="button"
        >
          ◉
        </button>
      </div>
    </div>

    <button
      class="submit-button"
      id="loginButton"
      type="submit"
    >
      <span>LOGIN</span>
    </button>

    <div class="status-text" id="statusText">
      Masukkan username dan password dari bot Telegram.
    </div>
  </form>
</main>

<footer class="footer">
  ZeZo App / Beta Testing Environment
</footer>

<div
  class="notification"
  id="notification"
  role="status"
  aria-live="polite"
>
  <div class="notification-icon" id="notificationIcon">
    ✓
  </div>

  <div class="notification-body">
    <div class="notification-label" id="notificationLabel">
      SYSTEM MESSAGE
    </div>

    <div class="notification-message" id="notificationMessage">
      Notification
    </div>
  </div>

  <button
    class="notification-close"
    id="notificationClose"
    type="button"
  >
    ×
  </button>
</div>

<script>
/*
  Supabase Edge Function login.
  Function ini nanti memeriksa username/password
  ke tabel zezo_keys.
*/
const LOGIN_API =
  "https://fmhddziqeryllwxyvtil.supabase.co/functions/v1/login";

const form =
  document.getElementById("loginForm");

const usernameInput =
  document.getElementById("username");

const passwordInput =
  document.getElementById("password");

const passwordToggle =
  document.getElementById("passwordToggle");

const loginButton =
  document.getElementById("loginButton");

const statusText =
  document.getElementById("statusText");

const notification =
  document.getElementById("notification");

const notificationIcon =
  document.getElementById("notificationIcon");

const notificationLabel =
  document.getElementById("notificationLabel");

const notificationMessage =
  document.getElementById("notificationMessage");

const notificationClose =
  document.getElementById("notificationClose");

let notificationTimer;

function showNotification(
  type,
  message,
  label
){
  clearTimeout(notificationTimer);

  notification.classList.remove(
    "success",
    "error"
  );

  notification.classList.add(
    type,
    "show"
  );

  notificationIcon.textContent =
    type === "success"
      ? "✓"
      : "×";

  notificationLabel.textContent =
    label ||
    (
      type === "success"
        ? "ACCESS GRANTED"
        : "ACCESS DENIED"
    );

  notificationMessage.textContent =
    message;

  notificationTimer = setTimeout(() => {
    notification.classList.remove("show");
  },5000);
}

passwordToggle.addEventListener(
  "click",
  () => {
    const hidden =
      passwordInput.type === "password";

    passwordInput.type =
      hidden ? "text" : "password";

    passwordToggle.textContent =
      hidden ? "◌" : "◉";
  }
);

notificationClose.addEventListener(
  "click",
  () => {
    notification.classList.remove("show");
  }
);

form.addEventListener(
  "submit",
  async event => {
    event.preventDefault();

    const username =
      usernameInput.value.trim();

    const password =
      passwordInput.value;

    if(!username || !password){
      showNotification(
        "error",
        "Gagal! Ada Kesalahan Di Username/Password",
        "LOGIN FAILED"
      );

      return;
    }

    loginButton.classList.add("loading");

    loginButton.querySelector("span")
      .textContent = "CHECKING";

    statusText.textContent =
      "Memeriksa data ke ZeZo Database...";

    try{
      const response =
        await fetch(
          LOGIN_API,
          {
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "Accept":"application/json"
            },
            body:JSON.stringify({
              username,
              password
            })
          }
        );

      const data =
        await response.json();

      if(!response.ok || !data.ok){
        throw new Error(
          data.message ||
          "Username atau password salah."
        );
      }

      /*
        Tidak menggunakan localStorage.
        Token hanya hidup selama tab browser aktif.
      */
      sessionStorage.setItem(
        "zezo_session",
        data.token
      );

      sessionStorage.setItem(
        "zezo_username",
        data.user?.username ||
        username
      );

      showNotification(
        "success",
        `Berhasil! Welcome ${
          data.user?.username || username
        } To ZezoApp`,
        "LOGIN SUCCESSFUL"
      );

      statusText.textContent =
        "Login berhasil. Mengalihkan ke dashboard...";

      setTimeout(() => {
        window.location.href =
          "dashboard.html";
      },1200);

    }catch(error){
      console.error(
        "LOGIN ERROR:",
        error
      );

      let message =
        "Gagal! Ada Kesalahan Di Username/Password";

      if(error instanceof TypeError){
        message =
          "Server login belum tersedia atau koneksi ditolak.";
      }

      showNotification(
        "error",
        message,
        "LOGIN FAILED"
      );

      statusText.textContent =
        "Login gagal. Periksa kembali data kamu.";

    }finally{
      loginButton.classList.remove("loading");

      loginButton.querySelector("span")
        .textContent = "LOGIN";
    }
  }
);

document.addEventListener(
  "keydown",
  event => {
    if(event.key === "Enter"){
      if(
        document.activeElement ===
        passwordToggle
      ){
        return;
      }
    }
  }
);
</script>

</body>
</html>
